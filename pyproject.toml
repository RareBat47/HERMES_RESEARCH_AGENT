[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-research-agent"
version = "0.1.0"
description = "Academic-first collaborative research assistant bot with literature pipeline, GROBID parsing, multi-agent synthesis, and Discord UX."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hermes Research Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "qdrant-client>=1.8.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "celery>=5.3.6",
    "discord.py>=2.3.2",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "bibtexparser>=1.4.0",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "cohere>=5.0.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "cohere>=5.0.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0"
]
bot = [
    "discord.py>=2.3.2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0"
]
worker = [
    "celery>=5.3.6",
    "redis>=5.0.0",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "qdrant-client>=1.8.0",
    "boto3>=1.34.0",
    "cohere>=5.0.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
