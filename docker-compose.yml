services:
  # ----------------------------------------------------------------------------
  # Relational Database: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hermes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_hermes_pass
      POSTGRES_DB: hermes_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Vector Database: Qdrant
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: hermes_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Message Broker & Cache: Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hermes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # S3-Compatible Object Store: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: hermes_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_hermes_admin
      MINIO_ROOT_PASSWORD: minio_hermes_secret_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Scientific PDF TEI XML Parser: GROBID
  # ----------------------------------------------------------------------------
  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: hermes_grobid
    restart: unless-stopped
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Core Backend API: FastAPI
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes_api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      grobid:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Background Task Worker: Celery
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes_worker
    restart: unless-stopped
    command: celery -A src.worker.worker.celery_app worker --loglevel=info -c 2
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # UI & Slash Command Interface: Discord Bot
  # ----------------------------------------------------------------------------
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes_discord_bot
    restart: unless-stopped
    command: python -m src.discord_bot.bot
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
